# ═══════════════════════════════════════════════════════════════════════════
# Brain Drain — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════
# On every push/PR: install → lint → typecheck → test → audit → build.
# On push to main: also build + push Docker image, then deploy (if secrets set).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   - No secrets needed for CI to run. Deploy steps only execute if secrets exist.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Quality gate ─────────────────────────────────────────────────
  # Runs on every push/PR. Must pass before merge.
  quality:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Job 2: Docker build ─────────────────────────────────────────────────
  # Verifies the Dockerfile builds. Only runs on main branch.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: brain-drain:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e NODE_ENV=production -e PORT=3000 \
            brain-drain:ci-${{ github.sha }}
          sleep 5
          curl -sf http://localhost:3000/api/healthz | jq -e '.status == "ok"'
          docker stop smoke || true

  # ── Job 3: Deploy (staging) ─────────────────────────────────────────────
  # Deploy to staging on every push to main. Requires deploy secrets.
  # Adapt the deploy step to your hosting platform (Render, Railway, Fly, VPS).
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        id: deploy
        env:
          # Set RENDER_DEPLOY_HOOK_URL in repo secrets to enable auto-deploy.
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy."
            echo "url=https://staging.braindrain.app" >> $GITHUB_OUTPUT
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "url=https://staging.braindrain.app" >> $GITHUB_OUTPUT
